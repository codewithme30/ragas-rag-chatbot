[pytest]
; Test folders = markers, so you can run one group: pytest -m generation
testpaths = tests
pythonpath = .
markers =
    retrieval: did the bot find the right HR pages?
    generation: is the answer grounded in those pages and on-topic?
    answer_quality: does the answer match the approved correct answer?
    non_llm: free, instant, word-matching metrics (no API key needed)
    negative: feed deliberately bad answers - the metric must catch them
addopts = --html=reports/pytest_report.html --self-contained-html -ra
filterwarnings =
    ignore::DeprecationWarning
